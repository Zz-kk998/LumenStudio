name: Build native desktop releases
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux Tk dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
      - name: Install packager
        run: python -m pip install -r requirements-build.txt
      - name: Build two binaries
        run: python build.py
      - name: Zip release with bundled MCP server
        run: python package_release.py ${{ matrix.target }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopAgent-${{ matrix.target }}
          path: release/*.zip
      - name: Publish assets for tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
